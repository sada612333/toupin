<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投屏接收端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        /* ===== 视频区域：占 2/3 ===== */
        .video-section {
            flex: 2;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .video-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .video-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .video-container:hover .video-controls {
            opacity: 1;
        }

        .video-controls-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            padding: 0;
        }

        .video-controls-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .video-controls-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            color: #94a3b8;
        }

        .video-placeholder-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .video-placeholder-text {
            font-size: 1.1rem;
        }

        .status-bar {
            padding: 10px 20px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        .status-dot.connected {
            background: #10b981;
            animation: pulse-green 2s infinite;
        }

        .status-dot.connecting {
            background: #f59e0b;
            animation: pulse-yellow 2s infinite;
        }

        .status-dot.error {
            background: #ef4444;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        }

        @keyframes pulse-yellow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
        }

        .status-text {
            font-weight: 500;
            font-size: 0.9rem;
            color: #475569;
        }

        .connection-time {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* ===== 控制侧栏：占 1/3 ===== */
        .sidebar {
            flex: 1;
            background: #fff;
            border-left: 1px solid #e5e7eb;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            overflow-y: auto;
            min-width: 280px;
            max-width: 400px;
        }

        .sidebar-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1e293b;
        }

        .section-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-field {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #94a3b8;
            background: #fff;
        }

        .input-field.invalid {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .input-field.invalid:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        .input-field::placeholder {
            color: #cbd5e1;
        }

        .port-field {
            width: 80px;
            flex-shrink: 0;
        }

        .validation-msg {
            font-size: 0.8rem;
            color: #dc2626;
            margin-top: 6px;
            min-height: 1.2em;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .validation-msg:not(:empty)::before {
            content: '⚠';
            font-size: 0.75rem;
        }

        .validation-msg:empty {
            min-height: 0;
            margin-top: 0;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline {
            background: #fff;
            color: #1e293b;
            border: 1.5px solid #e2e8f0;
        }

        .btn-outline:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .btn-outline:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger-outline {
            background: #fff;
            color: #dc2626;
            border: 1.5px solid #fecaca;
        }

        .btn-danger-outline:hover {
            background: #fef2f2;
        }

        /* 统计信息 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            border: 1px solid #f1f5f9;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
        }

        .stat-unit {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* 连接信息 */
        .info-card {
            background: #f8fafc;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid #f1f5f9;
        }

        .info-card-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .info-card-value {
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
        }

        /* 历史记录 */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: #f1f5f9;
            border-color: #e2e8f0;
        }

        .history-address {
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            font-family: 'Courier New', monospace;
        }

        .history-time {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .video-section {
                flex: none;
                height: 60vh;
            }

            .sidebar {
                flex: 1;
                max-width: none;
                min-width: 0;
                border-left: none;
                border-top: 1px solid #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 视频区域 -->
        <div class="video-section" id="videoSection">
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="videoPlaceholder">
                    <div class="video-placeholder-icon">📹</div>
                    <div class="video-placeholder-text" id="placeholderText">等待连接...</div>
                </div>
                <div class="video-controls">
                    <button class="video-controls-btn" id="fullscreenBtn" title="全屏">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">未连接</span>
                </div>
                <div class="connection-time" id="connectionTime"></div>
            </div>
        </div>

        <!-- 控制侧栏 -->
        <div class="sidebar">
            <div class="sidebar-title">投屏接收端</div>

            <div>
                <div class="section-label">发送端地址</div>
                <div class="input-row">
                    <div style="flex:1;display:flex;flex-direction:column">
                        <input
                            type="text"
                            id="ipInput"
                            class="input-field"
                            placeholder="192.168.1.100"
                        >
                        <div class="validation-msg" id="ipError"></div>
                    </div>
                    <div style="display:flex;flex-direction:column">
                        <input
                            type="text"
                            id="portInput"
                            class="input-field port-field"
                            placeholder="8888"
                            value="8888"
                        >
                        <div class="validation-msg" id="portError"></div>
                    </div>
                </div>
            </div>

            <button class="btn btn-outline" id="connectBtn">
                <span id="connectBtnText">连接</span>
            </button>

            <button class="btn btn-danger-outline" id="disconnectBtn" style="display: none;">
                断开连接
            </button>

            <div class="stats-grid" id="statsGrid" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="bitrateValue">0</div>
                    <div class="stat-unit" id="bitrateUnit">KB/s</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="framerateValue">0</div>
                    <div class="stat-unit">fps</div>
                </div>
            </div>

            <div id="connectionInfo" style="display: none;">
                <div class="section-label">连接信息</div>
                <div class="info-card">
                    <div class="info-card-label">连接状态</div>
                    <div class="info-card-value" id="connectionStatus">断开</div>
                </div>
            </div>

            <div id="historySection">
                <div class="section-label">历史连接</div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let ws = null;
        let peerConnection = null;
        let connectionStartTime = null;
        let connectionTimer = null;
        let heartbeatInterval = null;
        let statsInterval = null;
        let lastStatsBytesReceived = 0;
        let lastStatsTimestamp = 0;
        let lastFramesDecoded = 0;
        let lastFramesTimestamp = 0;
        let shouldReconnect = true;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 3;
        const HISTORY_KEY = 'toupin_connection_history';
        const MAX_HISTORY = 5;

        // ==================== DOM 元素 ====================
        const videoSection = document.getElementById('videoSection');
        const remoteVideo = document.getElementById('remoteVideo');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const placeholderText = document.getElementById('placeholderText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const connectionTime = document.getElementById('connectionTime');
        const ipInput = document.getElementById('ipInput');
        const portInput = document.getElementById('portInput');
        const ipError = document.getElementById('ipError');
        const portError = document.getElementById('portError');
        const connectBtn = document.getElementById('connectBtn');
        const connectBtnText = document.getElementById('connectBtnText');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statsGrid = document.getElementById('statsGrid');
        const bitrateValue = document.getElementById('bitrateValue');
        const bitrateUnit = document.getElementById('bitrateUnit');
        const framerateValue = document.getElementById('framerateValue');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionInfo = document.getElementById('connectionInfo');
        const historyList = document.getElementById('historyList');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // ==================== 全屏控制 ====================
        const fullscreenIcon = '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
        const restoreIcon = '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>';

        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function updateFullscreenBtn() {
            fullscreenBtn.innerHTML = isFullscreen() ? restoreIcon : fullscreenIcon;
            fullscreenBtn.title = isFullscreen() ? '还原' : '全屏';
        }

        fullscreenBtn.addEventListener('click', () => {
            if (isFullscreen()) {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            } else {
                const el = videoSection;
                (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
            }
        });

        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

        // ==================== 地址校验 ====================
        function validateIp(ip) {
            if (!ip) return '请输入 IP 地址';
            // IPv4：4 段，每段 0-255，不允许前导零
            const octet = '(0|[1-9]\\d?|1\\d\\d|2[0-4]\\d|25[0-5])';
            const ipv4Regex = new RegExp('^' + octet + '\\.' + octet + '\\.' + octet + '\\.' + octet + '$');
            if (ipv4Regex.test(ip)) {
                return '';
            }
            // 只包含数字和点但不符合 IPv4 格式 → 非法 IP（如 192.168.01.102、192.168.0.10211111）
            if (/^[\d.]+$/.test(ip)) {
                return 'IP 每段应在 0-255 之间，且不允许前导零';
            }
            // 域名 / localhost 作为补充
            const domainRegex = /^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*$/;
            if (ip === 'localhost' || domainRegex.test(ip)) {
                return '';
            }
            return 'IP 地址格式不正确';
        }

        function validatePort(port) {
            if (!port) return '请输入端口';
            const num = parseInt(port, 10);
            if (isNaN(num) || num < 1 || num > 65535) return '端口应在 1-65535';
            return '';
        }

        // touched 标记：只在用户交互过或点击连接后才显示错误
        let ipTouched = false;
        let portTouched = false;

        function validateInput(showAll = false) {
            const ip = ipInput.value.trim();
            const port = portInput.value.trim();
            const ipErr = validateIp(ip);
            const portErr = validatePort(port);

            if (ipTouched || showAll) {
                ipError.textContent = ipErr;
                ipInput.classList.toggle('invalid', !!ipErr);
            }
            if (portTouched || showAll) {
                portError.textContent = portErr;
                portInput.classList.toggle('invalid', !!portErr);
            }

            return !ipErr && !portErr;
        }

        ipInput.addEventListener('blur', () => { ipTouched = true; validateInput(); });
        portInput.addEventListener('blur', () => { portTouched = true; validateInput(); });
        ipInput.addEventListener('input', () => { if (ipTouched) validateInput(); });
        portInput.addEventListener('input', () => { if (portTouched) validateInput(); });

        // ==================== 历史连接记录 ====================
        function loadHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveHistory(history) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function addHistory(ip, port) {
            let history = loadHistory();
            const key = `${ip}:${port}`;
            // 去重：移除已有记录
            history = history.filter(h => h.key !== key);
            // 添加到顶部
            history.unshift({ key, ip, port, time: Date.now() });
            // 最多保留 5 条
            history = history.slice(0, MAX_HISTORY);
            saveHistory(history);
            renderHistory();
        }

        function formatHistoryTime(timestamp) {
            const d = new Date(timestamp);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            if (isToday) return time;
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) + ' ' + time;
        }

        function renderHistory() {
            const history = loadHistory();
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = '<div style="font-size:0.85rem;color:#94a3b8;padding:4px 0;">暂无记录</div>';
                return;
            }

            history.forEach(h => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <span class="history-address">${h.key}</span>
                    <span class="history-time">${formatHistoryTime(h.time)}</span>
                `;
                item.addEventListener('click', () => {
                    ipInput.value = h.ip;
                    portInput.value = h.port;
                    validateInput();
                });
                historyList.appendChild(item);
            });
        }

        renderHistory();

        // ==================== 状态更新 ====================
        function updateStatus(status) {
            statusDot.className = 'status-dot';

            switch (status) {
                case 'idle':
                    statusText.textContent = '未连接';
                    connectionStatus.textContent = '断开';
                    break;
                case 'connecting':
                    statusDot.className = 'status-dot connecting';
                    statusText.textContent = '连接中...';
                    connectionStatus.textContent = '连接中';
                    break;
                case 'connected':
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = '已连接';
                    connectionStatus.textContent = '已连接';
                    break;
                case 'error':
                    statusDot.className = 'status-dot error';
                    statusText.textContent = '连接错误';
                    connectionStatus.textContent = '错误';
                    break;
            }
        }

        function updateConnectionTime() {
            if (!connectionStartTime) return;

            const elapsed = Math.floor((Date.now() - connectionStartTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;

            let timeStr = '';
            if (hours > 0) {
                timeStr = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                timeStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }

            connectionTime.textContent = timeStr;
        }

        // ==================== 连接逻辑 ====================
        async function connect() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                console.warn('已存在连接，先断开再重新连接');
                shouldReconnect = false;
                cleanup();
                await new Promise(resolve => setTimeout(resolve, 100));
            }

            if (!validateInput(true)) return;

            const ip = ipInput.value.trim();
            const port = portInput.value.trim();
            const address = `ws://${ip}:${port}`;

            shouldReconnect = true;
            connectBtn.disabled = true;
            connectBtnText.textContent = '连接中...';
            updateStatus('connecting');
            console.log(`正在连接到 ${address}...`);

            try {
                const newWs = new WebSocket(address);
                ws = newWs;

                newWs.onopen = () => {
                    if (newWs !== ws) {
                        console.warn('忽略过期连接的 onopen 事件');
                        newWs.close();
                        return;
                    }
                    console.log('WebSocket 连接成功');
                    updateStatus('connected');
                    reconnectAttempts = 0;
                    startHeartbeat();
                    addHistory(ip, port);
                    connectBtn.style.display = 'none';
                    disconnectBtn.style.display = 'flex';
                    connectionInfo.style.display = 'block';
                };

                newWs.onmessage = async (event) => {
                    if (newWs !== ws) return;
                    try {
                        const message = JSON.parse(event.data);
                        console.log(`收到消息: ${message.type}`);
                        handleSignalingMessage(message);
                    } catch (e) {
                        console.error('解析消息失败:', e.message);
                    }
                };

                newWs.onclose = (event) => {
                    if (newWs !== ws) return;
                    console.warn(`WebSocket 连接关闭: ${event.code} ${event.reason}`);
                    cleanup();

                    if (shouldReconnect) {
                        reconnectAttempts++;
                        if (reconnectAttempts <= MAX_RECONNECT_ATTEMPTS) {
                            console.warn(`3秒后自动重连... (第${reconnectAttempts}次)`);
                            setTimeout(() => {
                                if (shouldReconnect) connect();
                            }, 3000);
                        } else {
                            console.error(`重连次数超过限制(${MAX_RECONNECT_ATTEMPTS}次)，停止重连`);
                            shouldReconnect = false;
                        }
                    }
                };

                newWs.onerror = () => {
                    if (newWs !== ws) return;
                    console.error('WebSocket 连接错误');
                    updateStatus('error');
                    connectBtn.disabled = false;
                    connectBtnText.textContent = '连接';
                };

            } catch (e) {
                console.error('连接失败:', e.message);
                updateStatus('error');
                connectBtn.disabled = false;
                connectBtnText.textContent = '连接';
                ws = null;
            }
        }

        // ==================== 信令处理 ====================
        async function handleSignalingMessage(message) {
            switch (message.type) {
                case 'offer':
                    console.log('收到 SDP Offer');
                    await handleOffer(message.payload);
                    break;
                case 'ice-candidate':
                    console.log('收到 ICE Candidate');
                    await handleIceCandidate(message.payload);
                    break;
                case 'heartbeat-ack':
                    // 心跳响应，静默处理
                    break;
                case 'stop':
                    console.warn('收到停止投屏通知');
                    shouldReconnect = false;
                    cleanup();
                    break;
            }
        }

        async function handleOffer(offer) {
            try {
                const config = {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun.qq.com:3478' }
                    ]
                };

                peerConnection = new RTCPeerConnection(config);

                peerConnection.ontrack = (event) => {
                    console.log('收到远端视频流');
                    remoteVideo.srcObject = event.streams[0];
                    videoPlaceholder.style.display = 'none';
                    statsGrid.style.display = 'grid';
                    startStatsUpdate();
                };

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('发送 ICE Candidate');
                        sendSignalingMessage('ice-candidate', {
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex,
                            candidate: event.candidate.candidate
                        });
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log(`连接状态: ${peerConnection.connectionState}`);
                    if (peerConnection.connectionState === 'connected') {
                        connectionStartTime = Date.now();
                        connectionTimer = setInterval(updateConnectionTime, 1000);
                    }
                };

                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                console.log('发送 SDP Answer');
                sendSignalingMessage('answer', {
                    sdp: answer.sdp,
                    type: answer.type
                });

            } catch (e) {
                console.error('处理 Offer 失败:', e.message);
            }
        }

        async function handleIceCandidate(candidate) {
            try {
                if (peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                }
            } catch (e) {
                console.error('添加 ICE Candidate 失败:', e.message);
            }
        }

        function sendSignalingMessage(type, payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type, payload }));
            }
        }

        // ==================== 统计信息 ====================
        async function updateStats() {
            if (!peerConnection) return;

            try {
                const stats = await peerConnection.getStats();
                let bytesReceived = 0;
                let framesDecoded = 0;
                let currentTimestamp = 0;

                stats.forEach(report => {
                    currentTimestamp = report.timestamp;
                    if (report.type === 'inbound-rtp' && report.kind === 'video') {
                        bytesReceived = report.bytesReceived || 0;
                        framesDecoded = report.framesDecoded || 0;
                    }
                });

                // 流量速率：转换为 KB/s 或 MB/s
                if (lastStatsBytesReceived > 0 && lastStatsTimestamp > 0) {
                    const timeDiffSeconds = (currentTimestamp - lastStatsTimestamp) / 1000;
                    if (timeDiffSeconds > 0) {
                        const bytesDiff = bytesReceived - lastStatsBytesReceived;
                        const bytesPerSecond = bytesDiff / timeDiffSeconds;

                        if (bytesPerSecond >= 1024 * 1024) {
                            // >= 1 MB/s
                            bitrateValue.textContent = (bytesPerSecond / (1024 * 1024)).toFixed(1);
                            bitrateUnit.textContent = 'MB/s';
                        } else {
                            // < 1 MB/s，显示 KB/s
                            bitrateValue.textContent = Math.round(bytesPerSecond / 1024).toString();
                            bitrateUnit.textContent = 'KB/s';
                        }
                    }
                }

                lastStatsBytesReceived = bytesReceived;
                lastStatsTimestamp = currentTimestamp;

                // 帧率：按秒计算 fps
                if (lastFramesDecoded > 0 && lastFramesTimestamp > 0) {
                    const timeDiffSeconds = (currentTimestamp - lastFramesTimestamp) / 1000;
                    if (timeDiffSeconds > 0) {
                        const framesDiff = framesDecoded - lastFramesDecoded;
                        const fps = Math.round(framesDiff / timeDiffSeconds);
                        framerateValue.textContent = fps.toString();
                    }
                }

                lastFramesDecoded = framesDecoded;
                lastFramesTimestamp = currentTimestamp;

            } catch (e) {
                // 静默失败
            }
        }

        function startStatsUpdate() {
            if (statsInterval) clearInterval(statsInterval);
            lastStatsBytesReceived = 0;
            lastStatsTimestamp = 0;
            lastFramesDecoded = 0;
            lastFramesTimestamp = 0;
            bitrateValue.textContent = '0';
            bitrateUnit.textContent = 'KB/s';
            framerateValue.textContent = '0';
            statsInterval = setInterval(updateStats, 1000);
        }

        // ==================== 心跳 ====================
        function startHeartbeat() {
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    sendSignalingMessage('heartbeat', {});
                }
            }, 5000);
        }

        // ==================== 清理 ====================
        function cleanup() {
            if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
            if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
            if (connectionTimer) { clearInterval(connectionTimer); connectionTimer = null; }

            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (ws) { ws.close(); ws = null; }

            remoteVideo.srcObject = null;
            videoPlaceholder.style.display = 'flex';
            placeholderText.textContent = '等待连接...';
            connectionTime.textContent = '';
            statsGrid.style.display = 'none';
            connectBtn.disabled = false;
            connectBtnText.textContent = '连接';
            connectBtn.style.display = 'flex';
            disconnectBtn.style.display = 'none';
            connectionInfo.style.display = 'none';
            updateStatus('idle');
        }

        function disconnect() {
            shouldReconnect = false;
            console.log('手动断开连接');
            cleanup();
        }

        // ==================== 事件绑定 ====================
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);

        // 回车连接
        ipInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') connect(); });
        portInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') connect(); });

        // 页面卸载清理
        window.addEventListener('beforeunload', () => {
            shouldReconnect = false;
            cleanup();
        });

        // 初始状态
        updateStatus('idle');
        console.log('投屏接收端已就绪，输入地址开始连接');

        // URL 参数预填充（支持 ?addr=192.168.1.100:8888 或 ?addr=ws://192.168.1.100:8888）
        const urlParams = new URLSearchParams(window.location.search);
        const prefillAddress = urlParams.get('addr');
        if (prefillAddress) {
            const cleaned = prefillAddress.replace(/^ws:\/\//, '').replace(/^wss:\/\//, '');
            const [preIp, prePort] = cleaned.split(':');
            if (preIp) ipInput.value = preIp;
            if (prePort) portInput.value = prePort;
            validateInput();
            console.log(`已预填充地址: ${prefillAddress}`);
        }
    </script>
</body>
</html>
